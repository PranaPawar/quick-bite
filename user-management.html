<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management - Quick Bite</title>

    <link rel="stylesheet" href="admin-style.css">
</head>

<body>

<header class="admin-header">

    <h1>🍔 Quick Bite - Admin Panel</h1>

    <nav>
        <button onclick="goDashboard()">Dashboard</button>
        <button onclick="goOrders()">Orders</button>
        <button onclick="goMenu()">Menu</button>
        <button onclick="goReports()">Reports</button>
        <button onclick="logout()">Logout</button>
    </nav>

</header>


<main class="admin-container">

    <h2>👥 User Management</h2>


    <!-- Add User -->

    <div class="menu-form">

        <h3>Add New User</h3>

        <input
            type="text"
            id="userName"
            placeholder="User Name"
        >

        <input
            type="email"
            id="userEmail"
            placeholder="Email"
        >

        <select id="userRole">

            <option value="Teacher">Teacher</option>
            <option value="Staff">Staff</option>

        </select>

        <button class="add-btn" onclick="addUser()">
            ➕ Add User
        </button>

    </div>


    <!-- Users Table -->

    <div class="menu-table">

        <h3>Registered Users</h3>

        <table>

            <thead>

                <tr>
                    <th>Sr.No</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="userList"></tbody>

        </table>

    </div>

</main>


<script>

let users =
    JSON.parse(localStorage.getItem("quickBiteUsers")) || [

    {
            name: "Teacher",
            email: "teacher@quickbite.com",
            role: "Teacher"
        },

        {
            name: "Staff",
            email: "staff@quickbite.com",
            role: "Staff"
        }

    ];


displayUsers();


function displayUsers() {

    let list =
        document.getElementById("userList");

    list.innerHTML = "";


    if (users.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="5">
                    No users found
                </td>
            </tr>
        `;

        return;
    }


    users.forEach((user, index) => {

        list.innerHTML += `

            <tr>

                <td>${index + 1}</td>

                <td>${user.name}</td>

                <td>${user.email}</td>

                <td>${user.role}</td>

                <td>

                   

                    <button
                        class="delete-btn"
                        onclick="deleteUser(${index})">
                        🗑️ Delete
                    </button>

                </td>

            </tr>

        `;

    });

}


// Add User

function addUser() {

    let name =
        document.getElementById("userName").value.trim();

    let email =
        document.getElementById("userEmail").value.trim();

    let role =
        document.getElementById("userRole").value;


    if (name === "" || email === "") {

        alert("Please enter Name and Email.");

        return;
    }


    users.push({

        name: name,

        email: email,

        role: role

    });


    saveUsers();


    document.getElementById("userName").value = "";

    document.getElementById("userEmail").value = "";


    alert("✅ User added successfully!");

}


// Edit User

function editUser(index) {

    let newName =
        prompt(
            "Enter User Name:",
            users[index].name
        );


    if (
        newName === null ||
        newName.trim() === ""
    ) {
        return;
    }


    let newEmail =
        prompt(
            "Enter Email:",
            users[index].email
        );


    if (
        newEmail === null ||
        newEmail.trim() === ""
    ) {
        return;
    }


    users[index].name =
        newName.trim();

    users[index].email =
        newEmail.trim();


    saveUsers();


    alert("✅ User updated successfully!");

}


// Delete User

function deleteUser(index) {

    let confirmDelete =
        confirm(
            "Are you sure you want to delete " +
            users[index].name + "?"
        );


    if (confirmDelete) {

        users.splice(index, 1);

        saveUsers();

        alert("🗑️ User deleted successfully!");

    }

}


// Save Users

function saveUsers() {

    localStorage.setItem(
        "quickBiteUsers",
        JSON.stringify(users)
    );

    displayUsers();

}


// Navigation

function goDashboard() {

    window.location.href = "dashboard.html";

}


function goOrders() {

    window.location.href = "orders.html";

}


function goMenu() {

    window.location.href = "menu-management.html";

}


function goReports() {

    window.location.href = "reports.html";

}


function logout() {

    sessionStorage.removeItem("adminLoggedIn");

    window.location.href = "login.html";

}

</script>

</body>
</html>
