<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cart - Quick Bite</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- NAVBAR -->

<header>

    <div class="logo">
        🍴 Quick Bite
    </div>

    <nav>

        <button onclick="location.href='home.html'">
            Home
        </button>

        <button onclick="location.href='about.html'">
            About Us
        </button>

        <button onclick="location.href='services.html'">
            Services
        </button>

        <button onclick="location.href='home.html#menu'">
            Menu
        </button>

    </nav>

</header>


<!-- CART PAGE -->

<section class="section">

    <p class="tag">
        YOUR CART
    </p>

    <h2>
        🛒 Shopping Cart
    </h2>


    <div id="cartItems">

        <!-- Cart items will appear here -->

    </div>


    <div class="cart-total">

        <h3>
            Total: ₹<span id="cartPageTotal">0</span>
        </h3>

    </div>


    <button
        class="main-btn"
        onclick="goDelivery()">

        Proceed to Delivery

    </button>


</section>


<footer>

    © 2026 Quick Bite |
    College Canteen Field Survey Project

</footer>


<script src="script.js"></script>


<script>

    displayCartPage();

</script>


</body>
</html>
