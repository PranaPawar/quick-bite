<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Login</title>

    <link rel="stylesheet" href="stylek.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>College Login</h1>
            <p class="subtitle">Welcome! Please sign in to continue.</p>

            <form id="loginForm">

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email ID</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">

                <label for="Contact">Contact number</label>
                <input type="tell id="contact"name="contact"
                placeholder="Enter your contact number"
                maxlength="10"
                required>

                <label for="department">Department</label>
                <select id="department">
                    <option value="">Select Department</option>
                    <option value="Computer Science">Computer Science</option>/option>
                    <option value="Commerce">Commerce</option>
                    <option value="Arts">Arts</option>
                    <option value="Science">Science</option>/option>
                    <option value="Other">Other</option>/option>
                </select>
                 
                <label for="Select">Select</label>
                <select id="select">
                    <option value="">Select option</option>
                    <option value="Teacher" >Teacher</option>
                    <option value="Admin">Admin</option>
                </select>
                <button type="button" class="signin-btn"
                onclick="signIn()">
                    Sign In
                </button>

            </form>
       
            <p id="message"></p>
        </div>
    </div>
   
    <script src="script copy 2.js"></script>
</body>
</html>
