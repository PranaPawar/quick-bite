<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quick Bite - Payment</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <div class="logo">
        🍴 Quick Bite
    </div>


    <nav>

        <button onclick="location.href='home.html'">
            Home
        </button>

        <button onclick="location.href='about.html'">
            About Us
        </button>

        <button onclick="location.href='services.html'">
            Services
        </button>

        <button onclick="location.href='orders.html'">
            📦 My Orders
        </button>

    </nav>

</header>


<section class="section">

    <h2>💳 Payment</h2>


    <p>
        Total Amount:
        <b>₹<span id="paymentTotal">0</span></b>
    </p>


    <h3>Select Payment Method</h3>


    <label>

        <input
            type="radio"
            name="payment"
            value="UPI"
            checked
            onchange="showUPIFields()"
        >

        UPI

    </label>
    <div id="upiFields">
        <label>UPI ID</label>
        <input
         type="text"
        id="upiId"
        placeholder="Enter UPI ID"
        >
        <label>UPI PIN</label>
        <input
         type="password"
        id="upiPin"
        maxlength="6"
        >
    </div>



    <label>

        <input
            type="radio"
            name="payment"
            value="COD"
            onchange="hideUPIFields()"
        >

        Cash on Delivery

    </label>


    <br><br>


    <button
        class="main-btn"
        onclick="placeOrder()"
    >

        💳 Pay & Place Order

    </button>


</section>


<footer>

    © 2026 Quick Bite 

</footer>


<script src="script.js"></script>

</body>

</html>
