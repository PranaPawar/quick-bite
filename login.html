<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Bite - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7f4;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .title {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #35a889;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #278c72;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">
            🍴 Quick Bite
        </div>

        <p class="title">
            Canteen Admin Login
        </p>

        <form onsubmit="adminLogin(event)">

            <label>Admin Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label>Admin Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p id="message"></p>

        <a href="../home.html" class="back-btn">
            ← Back to Teacher / Staff
        </a>
          
    </div>


    <script>

        function adminLogin(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            /*
                Demo login for field project
            */

            if (
                username !== "" &&
                password !== ""
            ) {

                sessionStorage.setItem(
                    "adminLoggedIn",
                    "true"
                );

                window.location.href =
                    "dashboard.html";

            } else {

                document.getElementById(
                    "message"
                ).innerText =
                    "❌ Invalid username or password";

                document.getElementById(
                    "message"
                ).style.color = "red";

            }

        }

    </script>

</body>

</html>
